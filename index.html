<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>月花乱舞 試作</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* ページの土台 */
body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* 夜の卓：深い藍鼠の卓に、紙の札。攻撃＝朱、防御＝藍、罠＝苔。気力は真鍮色。単一テーマ（意図的に暗い卓）。対戦画面は一画面に収める */
:root{
  color-scheme: dark;
  --table:#18212c;
  --table-2:#202b38;
  --table-3:#2a3746;
  --line:#3b4b5d;
  --fg:#e9edf1;
  --muted:#9aa8b6;
  --paper:#f1ead9;
  --ink:#201c17;
  --ink-muted:#5e574b;
  --atk:#c94a2a;
  --def:#356fb6;
  --trap:#47864d;
  --accent:#e2b247;
  --accent-ink:#231a05;
  --win:#7cc58a;
  --lose:#ee8a74;
  --font-display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --lamp-1:#fdf3d8;--lamp-2:#f1dcab;--lamp-3:#d4ad6a;--shadow-ink:#1b120a;
  --font-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{background:var(--table);height:100%}
body{
  color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--table)}
#app{max-width:560px;margin:0 auto;padding-block:14px 40px;display:flex;flex-direction:column;gap:14px}
#app.fit{height:100%;min-height:560px;padding-block:8px 10px;gap:7px}
/* 広い画面での拡大：#app を丸ごと拡大し、高さは拡大ぶん割り戻す */
body.zoomed #app{zoom:var(--z)}
body.zoomed #app.fit{min-height:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}

/* 汎用 */
.btn{appearance:none;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:700;min-height:46px;padding:10px 16px;cursor:pointer;letter-spacing:.02em;position:relative;overflow:hidden}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.sub{background:var(--table-3);color:var(--fg)}
.btn.wide{width:100%}
.tut-sum{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;font-size:14px}
.sound-row{gap:6px}
.sound-row>span{margin-right:4px}
.rank{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.rank b{font-family:var(--font-display);font-weight:800;font-size:28px;color:var(--accent)}
.chip.locked{opacity:.5}
.rankline{font-size:14px;color:var(--accent);font-weight:700}
.rankup{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--accent) 18%,transparent);border:1px solid var(--accent)}
.rankup b{font-family:var(--font-display);font-size:20px;color:#ffe7a3}
.rankup span{font-size:13px}
/* 札の裏の見た目（段位で解放） */
.back-ichimatsu .back{background:conic-gradient(#3b2d1d 25%,#22303d 0 50%,#3b2d1d 0 75%,#22303d 0) 0 0/16px 16px}
.back-seigaiha .back{background:radial-gradient(circle at 50% 100%,transparent 4px,rgba(241,220,171,.25) 5px 6px,transparent 7px 9px,rgba(241,220,171,.25) 10px 11px,transparent 12px) 0 0/24px 12px,radial-gradient(circle at 50% 100%,transparent 4px,rgba(241,220,171,.25) 5px 6px,transparent 7px 9px,rgba(241,220,171,.25) 10px 11px,transparent 12px) 12px 6px/24px 12px,#1d2a3a}
.back-kin .back{background:radial-gradient(circle at 30% 25%,rgba(255,240,190,.55),transparent 40%),linear-gradient(135deg,#7a5a1c,#e2b247 45%,#8a6420);border-color:#e2b247}
/* 舞台の月（段位で解放） */
.moon-beni .moon{background:radial-gradient(circle at 42% 40%,#ffd9cf,#d8583c 72%);box-shadow:0 0 34px 10px rgba(216,88,60,.3)}
.resume-sub{display:block;font-size:12px;font-weight:400;opacity:.85}
.btn.tiny.on{border-color:var(--accent);color:var(--accent)}
.btn.tiny{min-height:32px;padding:3px 10px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row > .btn{flex:1 1 auto}
.muted{color:var(--muted)}
.small{font-size:13px}
.panel{background:var(--table-2);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.label{font-size:12px;letter-spacing:.08em;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.chip{font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--table-3);color:var(--fg);border:1px solid transparent;white-space:nowrap}
button.chip{cursor:pointer;border-color:var(--line)}
.chip.warn{background:transparent;border-color:var(--accent);color:var(--accent)}
.chip.on{background:var(--accent);color:var(--accent-ink)}
.chip.haisui{background:var(--lose);color:var(--ink);font-weight:700}
.chip.trap{background:transparent;border-color:var(--trap);color:#9fd0a4}
.energy{display:inline-flex;align-items:baseline;gap:3px;font-size:12px;color:var(--accent);white-space:nowrap}
.energy b{font-family:var(--font-display);font-weight:400;font-size:20px;line-height:1}

/* タイトル */
.title{padding-block:18px 6px;display:flex;flex-direction:column;gap:6px;position:relative}
.title>*{position:relative}
.title .lamp{position:absolute;right:-6px;top:-4px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(253,243,216,.35) 0%,rgba(241,220,171,.12) 45%,transparent 70%);pointer-events:none}
.title .lamp svg,.title .lamp img{position:absolute;inset:22px;width:calc(100% - 44px);height:calc(100% - 44px);object-fit:contain;fill:var(--table);opacity:.9}
.title .lamp img{filter:brightness(.35)}
.title h1{font-family:var(--font-display);font-weight:400;font-size:clamp(44px,13vw,64px);line-height:1;letter-spacing:.04em}
.title .sub{color:var(--muted)}
.title .reading{font-size:12px;letter-spacing:.3em;color:var(--muted);margin-top:-2px}
.tri{font-size:13px;color:var(--muted)}
.tri b{font-weight:700}
.tri .a{color:var(--atk)}.tri .d{color:var(--def)}.tri .t{color:#9fd0a4}

/* 札：左上に気力（コスト）、右上に数字、効果は札に全文 */
.t-A{--tc:var(--atk)}.t-D{--tc:var(--def)}.t-T{--tc:var(--trap)}
.card{
  position:relative;appearance:none;border:0;cursor:pointer;
  aspect-ratio:5/8;width:100%;border-radius:8px;
  background:radial-gradient(120% 85% at 50% 38%,var(--lamp-1) 0%,var(--lamp-2) 55%,var(--lamp-3) 100%);color:var(--ink);
  border-top:6px solid var(--tc);overflow:hidden;
  padding:22px 5px 6px;
  display:flex;flex-direction:column;align-items:stretch;text-align:left;gap:1px;
  box-shadow:0 2px 0 rgba(0,0,0,.35);
  transition:transform .12s ease, box-shadow .12s ease;
  min-width:0;
}
.card>*{position:relative;z-index:1}
.card .ccost{position:absolute;top:3px;left:4px;width:18px;height:18px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1}
.card .cnum{position:absolute;top:2px;right:5px;font-family:var(--font-display);font-size:20px;line-height:1;color:var(--tc)}
.card .ctype{font-size:10px;font-weight:700;color:var(--tc);line-height:1.3}
.card .cname{font-size:12px;font-weight:700;line-height:1.2;word-break:keep-all;overflow-wrap:anywhere}
.card .ctext{font-size:9.5px;line-height:1.32;color:var(--ink-muted);overflow-wrap:anywhere;margin-top:1px}
.card .plain{margin:0;font-family:var(--font-display);font-weight:800;font-size:15px;color:var(--tc);line-height:1}
.card .cname{font-family:var(--font-display);font-weight:800}
/* 影絵：素の札は影を大きく濃く、効果の札は文字を読ませるため薄く敷く */
.card>.sil{position:absolute;z-index:0;right:-10%;bottom:-8%;width:100%;aspect-ratio:1;fill:var(--shadow-ink);opacity:.92;pointer-events:none}
.card:has(.ctext)>.sil{width:78%;right:-4%;bottom:-2%;opacity:.62}
.big.card:has(.ctext)>.sil{width:70%;opacity:.7}
/* 効果の札は絵の上に文字が重なるので、紙の色で縁取りして読ませる */
.card .ctext,.card .cname,.card .ctype{text-shadow:0 0 2px var(--lamp-1),0 0 2px var(--lamp-1),0 0 3px var(--lamp-1)}
.card.small>.sil{width:95%}
/* 札の飾り：金の細枠と角飾り。素の札の影は型の色でほのかに光る */
.card::after{content:"";position:absolute;inset:3px;border:1px solid rgba(150,108,36,.45);border-radius:5px;pointer-events:none;z-index:2;
  background:
    linear-gradient(#a8771f,#a8771f) left top/9px 2px no-repeat,linear-gradient(#a8771f,#a8771f) left top/2px 9px no-repeat,
    linear-gradient(#a8771f,#a8771f) right top/9px 2px no-repeat,linear-gradient(#a8771f,#a8771f) right top/2px 9px no-repeat,
    linear-gradient(#a8771f,#a8771f) left bottom/9px 2px no-repeat,linear-gradient(#a8771f,#a8771f) left bottom/2px 9px no-repeat,
    linear-gradient(#a8771f,#a8771f) right bottom/9px 2px no-repeat,linear-gradient(#a8771f,#a8771f) right bottom/2px 9px no-repeat}
.card.small::after,.crow .card::after{inset:2px;background-size:6px 1.5px,1.5px 6px,6px 1.5px,1.5px 6px,6px 1.5px,1.5px 6px,6px 1.5px,1.5px 6px}
.card:not(:has(.ctext))>.sil{filter:drop-shadow(0 0 3px color-mix(in srgb,var(--tc) 85%,transparent)) drop-shadow(0 0 9px color-mix(in srgb,var(--tc) 45%,transparent))}
.back{box-shadow:inset 0 0 0 1px rgba(184,137,47,.35)}
.card .tag{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:700;padding:0 6px;border-radius:999px;background:var(--accent);color:var(--accent-ink);white-space:nowrap;line-height:1.6}
.card .tag.ban{background:var(--ink);color:var(--paper)}
.card.sel{transform:translateY(-7px);box-shadow:0 0 0 3px var(--accent),0 8px 14px rgba(0,0,0,.4)}
.card.off{opacity:.4}
.card.small{aspect-ratio:5/7;padding:15px 3px 4px;border-top-width:4px}
.card.small .ccost{width:13px;height:13px;font-size:8.5px;top:2px;left:2px}
.card.small .cnum{font-size:13px;top:1px;right:3px}
.card.small .ctype{font-size:8.5px}
.card.small .cname{font-size:8.5px}
.card.small .ctext{display:none}
.card.small .plain{font-size:11px}
.back{
  aspect-ratio:5/7;width:100%;border-radius:7px;
  /* 札の裏：灯りの消えた障子の格子 */
  background:repeating-linear-gradient(0deg,transparent 0 8px,rgba(241,220,171,.13) 8px 9px),repeating-linear-gradient(90deg,transparent 0 8px,rgba(241,220,171,.13) 8px 9px),radial-gradient(circle at 50% 45%,#3b2d1d,#1f1810);
  border:2px solid #4a3a26;
}

/* 対戦画面（一画面） */
.topbar{display:flex;align-items:center;gap:8px;flex:none}
.topbar .turn{font-family:var(--font-display);font-size:16px;white-space:nowrap}
.timer{flex:1;height:8px;border-radius:99px;background:var(--table-3);overflow:hidden;position:relative}
.timer i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:99px;transition:width .2s linear}
.timer.low i{background:var(--lose)}
.tnum{font-variant-numeric:tabular-nums;font-weight:700;font-size:13px;min-width:2.6em;text-align:right}
.spacer{flex:1}
.side{display:flex;flex-direction:column;gap:5px;flex:none}
.side-head{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.side-head .who-line{display:flex;align-items:center;gap:10px}
.side-head h2{font-size:14px;font-weight:700}
.me-side .side-head{flex-wrap:nowrap}
.me-side .side-head .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;justify-content:flex-start;min-width:0}
.me-side .side-head .who-line{flex:none}
.me-side .side-head .chips::-webkit-scrollbar{display:none}
.chip.trap.wait{border-style:dashed;opacity:.8}
.oname{appearance:none;background:none;border:0;padding:0;display:inline-flex;align-items:center;gap:5px;cursor:pointer;color:var(--fg)}
.oname .mon{width:22px;height:22px;color:var(--fg)}
.oname i{font-style:normal;font-size:9px;color:var(--muted)}
.gtxt{position:absolute;top:4px;left:50%;transform:translateX(-50%);z-index:2;font-size:12px;color:#c9d3df;white-space:nowrap;pointer-events:none}
.gtxt b{color:var(--accent);font-size:15px}
.chip .mon+.mon{margin-left:-1px}
/* 手札は読みやすく：種類の文字は上の色帯で分かるので省き、名前と効果を大きく */
.hand .card .ctype{display:none}
.hand .card .cname{font-size:13px}
.hand .card .ctext{font-size:10.5px;line-height:1.3}
.hand.many .card .cname{font-size:11.5px}
.hand.lots .card .cname{font-size:10.5px}
@media (min-height:700px){
  .hand .card{aspect-ratio:5/9}
  .hand .card .cname{font-size:14px}
  .hand .card .ctext{font-size:11.5px;line-height:1.32}
  .hand.many .card .cname{font-size:12px}
  .hand.many .card .ctext{font-size:10.5px}
}
.hand .ctext{padding-bottom:6px}
.opp-hand{display:grid;grid-template-columns:repeat(7,36px);gap:5px}
.opp-hand.open{grid-template-columns:repeat(4,minmax(0,66px));gap:6px}
.opp-row .card.small .cname{font-size:11px}
.opp-row .card.small .cnum{font-size:16px}
.opp-row .card.small .ccost{width:16px;height:16px;font-size:10px}
/* 相手の見えている手札は、自分の手札のすぐ上に並べる（選ぶときに目線を動かさずに見られる） */
.opp-row{flex:none;display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:10px;background:color-mix(in srgb,var(--lose) 12%,var(--table-2));border:1px solid color-mix(in srgb,var(--lose) 45%,transparent)}
.opp-row .opp-hand{flex:1}
.opp-lbl{flex:none;font-size:11px;line-height:1.25;font-weight:700;color:var(--lose);text-align:center}

.chip.deckline{white-space:normal}
.openrule{display:flex;flex-direction:column;gap:4px}

.gauge{display:flex;flex-direction:column;gap:3px;flex:none}
.cells{display:grid;grid-template-columns:repeat(17,minmax(0,1fr));gap:2px;padding:3px 0;border-block:3px solid #5a3d24;background:#1a120b;border-radius:2px}
.cell{height:16px;border-radius:1px;background:linear-gradient(#8a6440,#6e4d30);position:relative}
.cell.goal-p,.cell.goal-c{background:linear-gradient(#3e2a18,#2b1c10)}
.cell.goal-p::before,.cell.goal-c::before{content:"";position:absolute;left:50%;top:-9px;width:9px;height:9px;transform:translateX(-50%);border-radius:50% 50% 30% 30%;background:var(--accent);box-shadow:0 0 6px rgba(226,178,71,.5)}
.cell.goal-p{box-shadow:inset 0 -3px 0 color-mix(in srgb,var(--win) 70%,transparent)}
.cell.goal-c{box-shadow:inset 0 -3px 0 color-mix(in srgb,var(--lose) 70%,transparent)}
.cell.mid{box-shadow:inset 0 0 0 1px rgba(241,220,171,.35)}
.cell.gain{background:linear-gradient(#6fbf7f,#3f8a4e);box-shadow:0 0 6px rgba(124,197,138,.45)}
.cell.loss{background:linear-gradient(#e0705a,#a8442f);box-shadow:0 0 6px rgba(238,138,116,.45)}
.cell.on{background:radial-gradient(circle,#fff6d6 0 30%,var(--accent) 70%);box-shadow:0 0 8px 2px rgba(226,178,71,.6);z-index:1}
.gauge-labels{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}
.gauge-labels b{color:var(--fg)}

.battle{flex:1 1 auto;min-height:96px;display:grid;grid-template-columns:minmax(0,.85fr) minmax(104px,1.3fr) minmax(0,.85fr);gap:6px}
/* 舞台：月夜。満月を背に、侍の影が向き合う */
.stage{position:relative;border-radius:12px;padding:4px 6px 6px;background:linear-gradient(#0c111b 0%,#16202e 62%,#121924 100%);overflow:hidden;isolation:isolate}
.stage>.slot,.stage>.center{position:relative;z-index:1}
.sky{position:absolute;inset:0;z-index:0;pointer-events:none}
.sky::after{content:"";position:absolute;left:0;right:0;bottom:0;height:13%;background:linear-gradient(#0a0e15,#06080c);border-top:1px solid rgba(241,227,176,.12)}
.moon{position:absolute;top:9%;left:50%;width:min(48px,14%);aspect-ratio:1;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle at 42% 40%,#fffbea,#efe0ac 72%);box-shadow:0 0 34px 10px rgba(241,227,176,.22)}
.scene-hotaru .petal{width:5px;height:5px;border-radius:50%;background:#e9ff9a;opacity:.9;box-shadow:0 0 6px 2px rgba(220,255,120,.6);animation-name:firefly}
@keyframes firefly{0%{transform:translate(0,60cqh);opacity:0}20%{opacity:.9}50%{transform:translate(14px,35cqh);opacity:.3}80%{opacity:.9}100%{transform:translate(-10px,10cqh);opacity:0}}
.scene-yuki .petal{width:5px;height:5px;border-radius:50%;background:#fff;opacity:.85}
.scene-momiji .petal{width:9px;height:9px;border-radius:2px;background:#d9542b;clip-path:polygon(50% 0,62% 32%,100% 28%,70% 55%,85% 100%,50% 75%,15% 100%,30% 55%,0 28%,38% 32%);opacity:.9}
.petal{position:absolute;top:-6%;width:7px;height:5px;border-radius:70% 0 70% 0;background:#f4c3d3;opacity:.75;animation:petal linear infinite}
@keyframes petal{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(-18px,55cqh) rotate(200deg)}100%{transform:translate(8px,115cqh) rotate(400deg)}}
.stage{container-type:size}
.stage[data-act=next]{cursor:pointer}
.center{position:relative;justify-content:flex-start}
.duel{position:absolute;z-index:0;left:0;right:0;bottom:0;height:88%;transform:translateX(var(--g1));pointer-events:none}
.play .duel{animation:gshift .5s .6s ease-in-out both}
@keyframes gshift{from{transform:translateX(var(--g0))}to{transform:translateX(var(--g1))}}
.samurai{position:absolute;bottom:6%;height:min(80%,210px);aspect-ratio:.6;fill:#05070b;filter:drop-shadow(0 0 1.2px rgba(226,234,255,.95)) drop-shadow(0 0 7px rgba(170,195,255,.35))}
/* 侍の姿の絵は正方形なので、縦長の枠いっぱいの高さで出す（横は枠からはみ出してよい） */
.samurai img.char{width:166.7%;max-width:none;margin-left:-33.3%}
.samurai img.mirror{transform:scaleX(-1)}
.samurai svg,.samurai img{width:100%;height:100%;display:block;object-fit:contain;object-position:bottom}
img.sil{object-fit:contain;height:auto}
.samurai.opp{left:24%}
.samurai.me{right:24%;transform:scaleX(-1)}
.play .samurai.opp.lunge{animation:lungeO .45s ease-out}
.play .samurai.me.lunge{animation:lungeM .45s ease-out}
.play .samurai.opp.hit{animation:hitO .5s .45s ease-out}
.play .samurai.me.hit{animation:hitM .5s .45s ease-out}
.play .samurai.opp.lunge.hit{animation:lungeO .45s ease-out,hitO .5s .45s ease-out}
.play .samurai.me.lunge.hit{animation:lungeM .45s ease-out,hitM .5s .45s ease-out}
@keyframes lungeO{45%{transform:translateX(70%)}}
@keyframes lungeM{45%{transform:scaleX(-1) translateX(70%)}}
@keyframes hitO{30%{transform:translateX(-30%) rotate(-8deg);filter:drop-shadow(0 0 3px #ff6b4a) drop-shadow(0 0 10px #ff6b4a)}}
@keyframes hitM{30%{transform:scaleX(-1) translateX(-30%) rotate(-8deg);filter:drop-shadow(0 0 3px #ff6b4a) drop-shadow(0 0 10px #ff6b4a)}}
.fx{position:absolute;pointer-events:none;opacity:0}

.og.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);color:var(--accent)}
.og.on .mon{color:var(--accent);opacity:1}
.sr-line{font-family:var(--font-display);font-size:16px;text-align:center}
.sr-foe{display:grid;grid-template-columns:90px minmax(0,1fr);gap:14px;align-items:center;background:linear-gradient(#0c111b,#16202e);border-radius:14px;padding:14px;border:1px solid var(--line)}
.sr-foe>img,.sr-foe>svg{width:90px;height:140px;object-fit:contain;fill:#05070b;filter:brightness(0) drop-shadow(0 0 1.5px rgba(226,234,255,.95)) drop-shadow(0 0 8px rgba(170,195,255,.35))}
.sr-foe.boss{border-color:#8fb6ff;box-shadow:0 0 18px rgba(143,182,255,.25)}
.sr-foe div{display:flex;flex-direction:column;gap:4px;min-width:0}
.sr-yomi{font-size:11px;letter-spacing:.2em;color:var(--muted)}
.sr-foe .foe-mon{width:16px;height:16px;filter:none;fill:currentColor;vertical-align:-3px;margin-right:3px;color:var(--fg)}
.sr-foe b{font-family:var(--font-display);font-weight:800;font-size:26px;line-height:1.2}
.sr-foe q{font-family:var(--font-display);font-size:15px}
.sr-foe q::before{content:"「"}.sr-foe q::after{content:"」"}
.rewards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.reward{appearance:none;border:1px solid var(--line);background:var(--table-2);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;cursor:pointer;color:var(--fg);text-align:left}
.reward:hover,.reward:focus-visible{border-color:var(--accent)}
.reward .card{cursor:pointer}
.reward>span{font-size:11.5px;line-height:1.45;color:var(--muted)}
.trapfire{font-family:var(--font-display);font-size:min(17px,13cqw);line-height:1.15;color:#fff;background:var(--trap);border-radius:8px;padding:5px 8px;display:flex;flex-direction:column;align-items:center;white-space:nowrap;box-shadow:0 0 0 2px #9fd0a4;animation:trapin .5s cubic-bezier(.2,1.6,.4,1) both}
.trapfire small{font-family:var(--font-body);font-size:11px;font-weight:700}
.trapfire.theirs{box-shadow:0 0 0 2px var(--lose)}
@keyframes trapin{0%{transform:scale(2.2) rotate(-6deg);opacity:0}100%{transform:none;opacity:1}}
.verdict .v{font-family:var(--font-display);font-size:min(20px,15cqw);line-height:1.25;white-space:nowrap}
.verdict .v.win{color:var(--win)}.verdict .v.lose{color:var(--lose)}
/* 説明は場の下に横幅いっぱいで出す（真ん中の列は狭くて見切れたため） */
/* お知らせは舞台の下に重ねて出す（結果の実況は出さないので、札や「競り勝ち！」は隠さない） */
.info{position:absolute;left:4px;right:4px;bottom:4px;z-index:5;display:flex;flex-direction:column;gap:4px;max-height:45%;overflow:auto;text-align:left}
.info:empty{display:none}
.info>p,.info>ul{background:rgba(6,9,14,.88);border-radius:8px;padding:5px 8px}
.info .msgs{font-size:11.5px;line-height:1.35}
.info .why{font-size:12.5px;font-weight:700;line-height:1.45}
.msgs{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px;font-size:12px;line-height:1.4}
.notice{font-size:11.5px;line-height:1.4;padding:5px 7px;border-radius:7px;border:1px solid var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent);text-align:left}
.notice.mull{display:flex;align-items:center;gap:8px}
.notice.mull span{flex:1}
.notice.alert{font-weight:700;animation:pulse 1.2s ease-in-out 2}
@keyframes pulse{50%{background:color-mix(in srgb,var(--accent) 30%,transparent)}}
.detail{font-size:11.5px;line-height:1.45;text-align:left;background:var(--table-2);border-radius:8px;padding:6px 8px}
.detail b{display:block;font-size:12.5px}
.hintline{font-size:11.5px;color:var(--muted)}

.hand{display:grid;grid-template-columns:repeat(var(--n,5),minmax(0,1fr));gap:6px;padding:9px 0 9px}
/* 手札が多いときは札を細くして、横一列に収める（スクロールしない）。7枚以上は効果の文を隠す（タップで説明が出る） */
.hand.many{gap:4px}
.hand.many .card{padding:20px 3px 5px}
.hand.many .card .cname{font-size:10.5px}
.hand.many .card .cnum{font-size:16px}
.hand.lots .card .ctext{display:none}
.hand.lots .card .cname{font-size:9.5px}
.actions{display:flex;flex-direction:column;gap:6px;flex:none}
.acts{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px}
.acts .btn{padding:8px 4px;font-size:14px}
.btn.sub.on{background:var(--lose);color:var(--ink)}
.card.burn{opacity:.6;box-shadow:0 0 0 3px var(--lose)}
.energy .plus{color:var(--lose);font-weight:700;font-size:13px;margin-left:1px}
.energy .gain{color:var(--win);font-weight:700;font-size:13px;margin-left:2px;animation:pop .5s ease-out both}
@keyframes pop{from{transform:scale(1.8);opacity:0}to{transform:none;opacity:1}}
/* 燃やした札：札は薄く、上に「燃やした 気力+n」の帯 */
.big.burnt>:not(.burnmark){opacity:.3}
.burnmark{position:absolute;left:6%;right:6%;top:50%;transform:translateY(-50%);background:var(--lose);color:var(--ink);border-radius:8px;text-align:center;font-weight:700;font-size:12px;line-height:1.25;padding:5px 2px;display:flex;flex-direction:column;align-items:center}
.burnmark b{font-family:var(--font-display);font-weight:400;font-size:20px;line-height:1.1}
.burnmark small{font-size:10px;font-weight:400}
.prompt{font-size:12.5px;color:var(--accent);font-weight:700}
.auto{position:absolute;inset:auto 0 0 0;height:4px;background:var(--accent-ink);opacity:.35;transform-origin:left;animation:autofill linear both}
@keyframes autofill{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* モーダル */
.modal-bg{position:fixed;inset:0;background:rgba(8,12,18,.72);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:20}
.modal{background:var(--table-2);border:1px solid var(--line);border-radius:16px;padding:18px;max-width:440px;width:100%;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:12px}
.modal h2{font-family:var(--font-display);font-weight:400;font-size:30px}
.modal h2.win{color:var(--win)}.modal h2.lose{color:var(--lose)}
.modal .result{font-family:var(--font-display);font-weight:800;font-size:20px;margin-top:-6px}
.modal .result.win{color:var(--win)}.modal .result.lose{color:var(--lose)}
.dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.dl dt{color:var(--muted)}.dl dd{margin:0}
.mini-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.loglist{margin:0;padding-left:1.4em;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:3px}

/* 流派選び */
.abil{appearance:none;text-align:left;background:var(--table-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:2px 10px}
.abil:hover{border-color:var(--accent)}
.abil b{font-size:17px}
.abil .when{font-size:12px;color:var(--accent);align-self:center}
.abil .t{grid-column:1/-1;font-size:13px;color:var(--muted)}
.abil.has-mon{grid-template-columns:48px minmax(0,1fr);column-gap:12px;align-items:center}
.abil.has-mon .mon{grid-row:1/3;width:48px;height:48px}
.abil.has-mon .t{grid-column:2}
.mon{fill:currentColor;color:var(--accent);flex:none}
.abil .mon{color:var(--fg);opacity:.85}
.abil.picked .mon{color:var(--accent);opacity:1}
.chip:has(.mon){display:inline-flex;align-items:center;gap:4px;padding:2px 10px 2px 3px;font-size:13px}
.chip .mon{width:24px;height:24px;color:inherit}
.chip .mon+.mon,.chip .sep+.mon{margin-left:2px}
.abil:disabled{opacity:.38;cursor:not-allowed}
.abil.picked{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.abil.picked b::before{content:"✓ ";color:var(--accent)}
.kataline{display:flex;align-items:center;gap:6px}
.kataline .mon{width:26px;height:26px;color:var(--accent);flex:none}
.pickh{font-size:15px;margin-top:6px}
.startbar{position:sticky;bottom:0;padding:10px 0 14px;background:linear-gradient(transparent,var(--table) 30%)}
.abil .k{display:inline-block;font-size:11px;font-weight:700;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:0 4px;margin-right:6px}

/* デッキ */
.sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--table);padding-block:8px;display:flex;flex-direction:column;gap:6px}
.stats{display:flex;gap:14px;flex-wrap:wrap;font-variant-numeric:tabular-nums;align-items:baseline}
.stat b{font-family:var(--font-display);font-weight:400;font-size:22px}
.stat.bad b{color:var(--lose)}
.stat.ok b{color:var(--win)}
.group{display:flex;flex-direction:column;gap:6px}
.group h3{font-size:14px;display:flex;align-items:center;gap:8px}
.group h3::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--tc)}
.crow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--table-2);border-radius:10px;padding:6px 8px}
.crow .card{cursor:default;aspect-ratio:5/7;padding:16px 2px 2px}
.crow .card .ccost{width:14px;height:14px;font-size:9px;top:2px;left:2px}
.crow .card .cnum{font-size:14px;top:2px;right:3px}
.crow .card .plain{font-size:12px}
.crow .cinfo{min-width:0;display:flex;flex-direction:column;gap:2px}
.crow .cinfo b{font-size:15px;line-height:1.35}
.crow .cinfo .stat-line{font-size:12px;font-weight:400;color:var(--muted)}
.crow .cinfo .eff{font-size:13px;color:var(--fg);opacity:.88;line-height:1.5}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--table-3);cursor:pointer;font-weight:700;font-size:18px;line-height:1}
.stepper button:disabled{opacity:.3;cursor:not-allowed}
.stepper .n{min-width:1.6em;text-align:center;font-variant-numeric:tabular-nums;font-weight:700}
.stepper .n.zero{color:var(--muted);font-weight:400}

.rules ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}
select{font:inherit;background:var(--table-3);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 8px}

/* 背の低い画面：手札を少し低くして一画面に収める */
@media (max-height:720px){
  .big.card .ctext{font-size:10px;line-height:1.32}
  .opp-hand{grid-template-columns:repeat(7,30px)}
  .opp-hand.open{grid-template-columns:repeat(4,minmax(0,52px))}
  .gauge .cell{height:13px}
}
@media (prefers-reduced-motion: reduce){
  .reveal,.nanori,.pro-text p,.pro-text h1,.notice.alert,.auto,.energy .gain,.cutin,.trapfire,.yomi,.play.shake,.kessen,.stage.finale::after,.stage.finale .calls,.stage.finale .samurai,.modal.result-modal,.petal,.duel,.samurai,.calls{animation:none!important}
  .fx{display:none}
  .card,.timer i{transition:none}
}

function cleanDeck(obj){
  const out={};if(!obj||typeof obj!=='object')return null;
  for(const [id,c] of Object.entries(obj)){if(CARDS[id]&&Number.isInteger(c)&&c>0)out[id]=Math.min(c,COPY_MAX);}
  return out;
}

(function padDeck(){let n=Object.values(deck).reduce((a,b)=>a+b,0);if(!n||n>=DECK_SIZE)return;
  const fill=['A13','D13','A18','D18','A8','D8','A24','D24','A4','D4','A30','D30'];
  for(let k=0;n<DECK_SIZE&&k<99;k++){const id=fill[k%fill.length];if((deck[id]||0)<COPY_MAX){deck[id]=(deck[id]||0)+1;n++}}

function deckStats(counts,kata=settings.deckKata){

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

/* ---------- 解決（純関数：状態は変えない） ----------
   P,C は両者の状態、pd,cd は出したカードの定義（見送った・燃やしたなら null）、pb,cb は燃やした札の定義
   返り値：toC＝あなたが相手を押す量、toP＝相手があなたを押す量 */
const kind=d=>!d||d.type==='T'?'P':d.type;
function outcome(P,C,pd,cd,pb=null,cb=null){
  const kp=kind(pd),kc=kind(cd),notes=[],fx={banP:false,banC:false,stealFromP:0,stealFromC:0,firedP:[],firedC:[]};
  const numOf=(s,d,k)=>k==='A'?d.num+(s.yokoku?10:0)+(d.eff==='shizan'?shizanBonus(s):0):k==='D'?d.num:0;
  const np=numOf(P,pd,kp),nc=numOf(C,cd,kc);
  let toC=0,toP=0,why='';
  if(kp==='A'&&kc==='A'){
    const ip=pd.eff==='iai',ic=cd.eff==='iai';
    if(ip&&!ic){toC=np;why=`居合：攻撃${nc}より先に斬って、${np}押す`}
    else if(ic&&!ip){toP=nc;why=`相手の居合：攻撃${np}より先に斬られて、${nc}押される`}
    else if(np>nc){toC=np;why=`攻撃どうし：${np}が${nc}に勝って、${np}押す`}
    else if(nc>np){toP=nc;why=`攻撃どうし：${nc}が${np}に勝って、${nc}押す`}
    else why=`攻撃どうし：同じ${np}で相打ち`;
  }else if(kp==='A'&&kc==='D'){
    const wall=using(C,'uke'),dn=pd.eff==='kuzushi'&&!wall?Math.floor(nc/2):nc;
    if(dn!==nc)notes.push(`崩し：相手の防御${nc}を${dn}に崩した`);
    if(pd.eff==='kantsu'||using(P,'gougeki')){toC=np;why=pd.eff==='kantsu'?'貫通：防御を無視して押す':'剛撃：防御を無視して押す';if(pd.eff!=='kantsu')fx.ougiP='gougeki'}
    else if(wall||dn>=np){
      if(pd.eff==='youdou'){fx.nextAtkP=true;why='陽動：防がれたが、跳ね返されない（次のターン攻撃+10）'}
      else{toP=np;if(wall&&dn<np)fx.ougiC='uke';why=wall&&dn<np?`相手の柳の受け：攻撃${np}を防ぎきって、${np}跳ね返された`:`相手の防御${dn}が攻撃${np}を防ぎきって、${np}跳ね返された`}
      if(cd.eff==='zanshin'){fx.nextAtkC=true;notes.push('相手の残心：次のターン、相手の攻撃+10')}
    }
    else{toC=np-dn;why=`攻撃${np}が防御${dn}を上回って、差の${np-dn}押す`}
    if(toP>0&&cd.eff==='hangeki'){toP+=10;notes.push('相手の反撃：さらに10押し返された')}
    if(toP>0&&C.kata==='yanagi'){toP+=5;notes.push(`${kataOf(C,false)}：さらに5跳ね返された`)}
    if(toP>0&&C.haisui){toP+=HAISUI_BACK;notes.push(`相手の背水：さらに${HAISUI_BACK}押し返された`)}
    if(cd.eff==='fuuji'&&toC===0){fx.banP=true;notes.push('封じ手：次のターン、あなたは攻撃できない')}
  }else if(kc==='A'&&kp==='D'){
    const wall=using(P,'uke'),dp=cd.eff==='kuzushi'&&!wall?Math.floor(np/2):np;
    if(dp!==np)notes.push(`相手の崩し：あなたの防御${np}を${dp}に崩された`);
    if(cd.eff==='kantsu'||using(C,'gougeki')){toP=nc;why=cd.eff==='kantsu'?'相手の貫通：防御を無視して押された':'相手の剛撃：防御を無視して押された';if(cd.eff!=='kantsu')fx.ougiC='gougeki'}
    else if(wall||dp>=nc){
      if(cd.eff==='youdou'){fx.nextAtkC=true;why='相手の陽動：防いだが、跳ね返せない（相手は次のターン攻撃+10）'}
      else{toC=nc;if(wall&&dp<nc)fx.ougiP='uke';why=wall&&dp<nc?`柳の受け：攻撃${nc}を防ぎきって、${nc}跳ね返した`:`防御${dp}が攻撃${nc}を防ぎきって、${nc}跳ね返した`}
      if(pd.eff==='zanshin'){fx.nextAtkP=true;notes.push('残心：次のターン、あなたの攻撃+10')}
    }
    else{toP=nc-dp;why=`相手の攻撃${nc}が防御${dp}を上回って、差の${nc-dp}押される`}
    if(toC>0&&pd.eff==='hangeki'){toC+=10;notes.push('反撃：さらに10押し返した')}
    if(toC>0&&P.kata==='yanagi'){toC+=5;notes.push(`${kataOf(P,true)}：さらに5跳ね返した`)}
    if(toC>0&&P.haisui){toC+=HAISUI_BACK;notes.push(`背水：さらに${HAISUI_BACK}押し返した`)}
    if(pd.eff==='fuuji'&&toP===0){fx.banC=true;notes.push('封じ手：次のターン、相手は攻撃できない')}
  }else if(kp==='A'){toC=np;why='相手は防いでいない：そのまま押す'}
  else if(kc==='A'){toP=nc;why='あなたは防いでいない：そのまま押される'}
  else why='どちらも攻撃していない';
  // 攻め手の上乗せ
  const boost=(side,d,k,ok,push,who,isP)=>{
    if(k!=='A')return push;
    if(push>0&&d.eff==='rengeki'&&ok==='P'){push*=2;notes.push(`連撃：${who}の押す量が2倍`)}
    if(push>0&&d.eff==='oiuchi'){push+=10;notes.push(`追い討ち：${who}がさらに10押す`)}
    if(push>0&&side.kata==='gou'){push+=5;notes.push(`${kataOf(side,isP)}：さらに5押す`)}
    return push;
  };
  const baseC=toC,baseP=toP;
  toC=boost(P,pd,kp,kc,toC,'あなた',true);toP=boost(C,cd,kc,kp,toP,'相手',false);
  if(kp==='A'&&pd.eff==='sutemi'&&baseC===0){toP+=10;notes.push('捨て身：押せなかったので、あなたが10押される')}
  if(kc==='A'&&cd.eff==='sutemi'&&baseP===0){toC+=10;notes.push('相手の捨て身：押せなかったので、相手が10押される')}
  // 火消し：相手が燃やしていたら、その気力を消して+10
  if(kp==='A'&&pd.eff==='hikeshi'&&cb){toC+=10;fx.douseC=true;notes.push('火消し：相手の燃やした気力を消して、さらに10押す')}
  if(kc==='A'&&cd.eff==='hikeshi'&&pb){toP+=10;fx.douseP=true;notes.push('相手の火消し：燃やした気力を消され、さらに10押された')}
  // 線香花火：燃やすと相手を5歩押し込む
  // 燃やした炎で押す札（線香花火・火矢・焙烙玉）。相手が防御していたら止められる
  for(const [b,isP,ok] of [[pb,true,kc],[cb,false,kp]]){if(!b)continue;const v=BURN_PUSH[b.eff]||0;if(!v)continue;if(ok==='D'){notes.push(`${isP?'':'相手の'}${b.name}：防御に止められた`);continue}if(isP)toC+=v;else toP+=v;notes.push(`${isP?'':'相手の'}${b.name}：${v}押す`)}
  // 構え：相手が攻撃してこなかったら、気力が戻る
  if(kp==='D'&&pd.eff==='kamae'&&kc!=='A'){fx.refundP=true;notes.push('構え：相手が攻撃してこなかったので、気力が戻る')}
  if(kc==='D'&&cd.eff==='kamae'&&kp!=='A'){fx.refundC=true;notes.push('相手の構え：あなたが攻撃しなかったので、相手の気力が戻る')}
  // 受け手の軽減
  if(cd&&cd.eff==='ukenagashi'&&toC>0){toC=Math.floor(toC/2);notes.push('相手の受け流し：押す量が半分')}
  if(pd&&pd.eff==='ukenagashi'&&toP>0){toP=Math.floor(toP/2);notes.push('あなたの受け流し：押される量が半分')}
  // 罠（見切りで外された罠は発動しない）。置いてある罠はそれぞれ発動する
  const trap=(owner,victimD,victimK,victimN,isP,victimBurn,nowD)=>{
    if(victimD&&victimD.eff==='mikiri')return;
    const on=isP?'あなた':'相手',vn=isP?'相手':'あなた';
    // 場の罠と、このターンに張った罠（張ったターンから効く）
    const list=owner.traps.filter(t=>t.active).map(t=>({id:def(t.inst).eff,uid:t.inst.uid,name:def(t.inst).name}));
    if(nowD&&nowD.type==='T')list.push({id:nowD.eff,uid:'now',name:nowD.name});
    for(const t of list){
      const id=t.id;let fired=false;
      if(id==='otoshiana'&&victimK==='A'){fired=true;if(isP)toP=Math.max(0,toP-15);else toC=Math.max(0,toC-15);notes.push(`${on}の落とし穴：押される量を15減らした`)}
      if(id==='kaeshi'&&victimK==='A'&&victimN>=18){fired=true;if(isP){toP=0;toC+=victimN}else{toC=0;toP+=victimN}notes.push(`${on}の返し罠：攻撃を跳ね返して${victimN}押した`)}
      if(id==='dorobou'&&victimK==='A'){fired=true;if(isP)fx.stealFromC=15;else fx.stealFromP=15;notes.push(`${on}の気力泥棒：${vn}の気力を奪う`)}
      if(id==='machibuse'&&victimK!=='A'){fired=true;if(isP)toC+=15;else toP+=15;notes.push(`${on}の待ち伏せ：${vn}を15押した`)}
      if(id==='ashikase'&&victimK==='A'){fired=true;if(isP)fx.banC=true;else fx.banP=true;notes.push(`${on}の足かせ：次のターン、${vn}は攻撃できない`)}
      if(id==='naruko'&&victimBurn){fired=true;if(isP)fx.narukoP=true;else fx.narukoC=true;notes.push(`${on}の鳴子：${vn}の燃やした気力を${on}がもらう`)}
      if(id==='kagemusha'&&victimK==='A'){fired=true;if(isP)toP=0;else toC=0;notes.push(`${on}の影武者：身代わりになって、押し込まれない`)}
      if(id==='hakaabaki'&&victimBurn){fired=true;if(isP)fx.robC=true;else fx.robP=true;notes.push(`${on}の墓暴き：${vn}の燃やした札をもらう`)}
      if(id==='hyourou'&&victimK!=='A'&&victimK!=='D'){fired=true;if(isP)fx.millC=(fx.millC||0)+4;else fx.millP=(fx.millP||0)+4;notes.push(`${on}の兵糧攻め：${vn}の山札を4枚捨てさせる`)}
      if(id==='kitsunebi'&&victimK==='D'){fired=true;if(isP){fx.drainC=10;toC+=5}else{fx.drainP=10;toP+=5}notes.push(`${on}の狐火：${vn}の気力を10減らして、5押した`)}
      if(fired)(isP?fx.firedP:fx.firedC).push({uid:t.uid,name:t.name});
    }
  };
  trap(P,cd,kc,nc,true,cb,pd);trap(C,pd,kp,np,false,pb,cd);
  // 業火：燃やした札の気力ぶん押す（攻撃ではないので、防御や罠には関係しない）
  if(pb&&using(P,'gouka')&&burnVal(pb,P)>0){const v=Math.min(20,Math.ceil(burnVal(pb,P)/2));toC+=v;fx.ougiP='gouka';notes.push(`業火：燃やした炎で${v}歩押し込む`)}
  if(cb&&using(C,'gouka')&&burnVal(cb,C)>0){const v=Math.min(20,Math.ceil(burnVal(cb,C)/2));toP+=v;fx.ougiC='gouka';notes.push(`相手の業火：燃やした炎で${v}歩押し込まれた`)}
  // 一閃：押し込めたら+15歩。不動：押し込まれない（いちばん最後に効く）
  if(toC>0&&using(P,'issen')){const g=P.kata==='gou'&&toC>=5?5:0;toC+=10-g;fx.ougiP='issen';notes.push(g?'一閃：剛の5と合わせて10歩押し込む':'一閃：さらに10歩押し込む')}
  if(toP>0&&using(C,'issen')){const g=C.kata==='gou'&&toP>=5?5:0;toP+=10-g;fx.ougiC='issen';notes.push(g?'相手の一閃：剛の5と合わせて10歩押し込まれた':'相手の一閃：さらに10歩押し込まれた')}
  if(using(P,'genwaku')||using(C,'genwaku')){
    const a=toC,b=toP,gp=using(P,'genwaku'),gc=using(C,'genwaku');
    toC=(gp?b:0)+(gc?0:a);toP=(gc?a:0)+(gp?0:b);
    if(gp&&b>0)fx.ougiP='genwaku';if(gc&&a>0)fx.ougiC='genwaku';
    if(gp&&b>0)notes.push(`幻惑：押し込まれるはずの${b}歩を、逆に押し込んだ`);
    if(gc&&a>0)notes.push(`相手の幻惑：押し込むはずの${a}歩を、逆に押し込まれた`);
  }
  if(toP>0&&using(P,'fudou')){toP=0;fx.ougiP='fudou';notes.push('不動：押し込まれない')}
  if(toC>0&&using(C,'fudou')){toC=0;fx.ougiC='fudou';notes.push('相手の不動：押し込めない')}
  // 押せたら効く札（不動で止められたら効かない）
  if(kp==='A'&&toC>0&&pd.eff==='onryou'){const n=P.discard.filter(x=>def(x).eff==='onryou').length;if(n){toC+=5*n;notes.push(`怨霊：墓地の怨霊${n}枚で、さらに${5*n}押す`)}}
  if(kc==='A'&&toP>0&&cd.eff==='onryou'){const n=C.discard.filter(x=>def(x).eff==='onryou').length;if(n){toP+=5*n;notes.push(`相手の怨霊：墓地の怨霊${n}枚で、さらに${5*n}押された`)}}
  if(kp==='A'&&toC>0){if(pd.eff==='mizuzeme')fx.millC=(fx.millC||0)+3;if(pd.eff==='yakiuchi')fx.discC=true;if(pd.eff==='kanashibari')fx.noDefC=true}
  if(kc==='A'&&toP>0){if(cd.eff==='mizuzeme')fx.millP=(fx.millP||0)+3;if(cd.eff==='yakiuchi')fx.discP=true;if(cd.eff==='kanashibari')fx.noDefP=true}
  // 退き足：自分から5歩下がる（不動や幻惑でも打ち消せない）
  if(pd&&pd.eff==='hikiashi'){toP+=5;notes.push('退き足：自分から5歩下がった')}
  if(cd&&cd.eff==='hikiashi'){toC+=5;notes.push('相手の退き足：相手が自分から5歩下がった')}
  return {toC,toP,net:toC-toP,why,notes,fx,base:baseC-baseP};
}

function mill(s,n){let k=0;while(k<n&&s.deck.length){s.discard.push(s.deck.pop());k++}return k}
function drawN(s,n){let k=0;while(k<n&&s.deck.length&&s.hand.length<(s.handMax||HAND_MAX)){s.hand.push(s.deck.pop());k++}return k}
function newSide(counts,kata,ougi){
  const d=[];for(const [id,c] of Object.entries(counts))for(let k=0;k<c;k++){const x=mk(id);if(isOff(id,kata))x.off=true;d.push(x)}
  const s={deck:shuffle(d),hand:[],discard:[],kata,ougi,ougiUsed:false,ougiNow:false,energy:ENERGY_START-ENERGY_GAIN,burnGain:0,traps:[],
    noAtk:false,noAtkNext:false,noDef:false,noDefNext:false,cap:false,capNext:false,yokoku:false,yokokuNext:false,history:[]};
  drawN(s,HAND_START);return s;
}
/* 出すのに要る気力（屍姫で加えた札は0） */
const costOf=i=>i.free?0:def(i).cost;
/* 出せるか（理由つき） */
function blockReason(s,i){
  const d=def(i);
  if(s===(G&&G.p)&&tutStep()&&!tutStep().allow.includes(i.id))return 'いまは使わない';
  if(costOf(i)>s.energy)return '気力不足';
  if(d.type==='A'&&s.noAtk)return '攻撃不可';
  if(d.type==='D'&&s.noDef)return '防御不可';
  if(s.cap&&costOf(i)>=20)return '関所';
  return '';
}

/* 相手の手の種類（先読みで見える） */
const actKind=ch=>ch.play&&def(ch.play).type==='A'?'攻撃してくる':'攻撃してこない';
/* 使った瞬間に効く奥義。返り値は使った本人向けの説明 */
function ougiNow(me,op){
  if(me.ougi==='tensei'){
    // 効果のある札は、数字のいちばん近い素の札に（同じ近さなら小さいほう）
    const near=n=>PLAIN.reduce((b,[m])=>Math.abs(m-n)<Math.abs(b-n)?m:b,PLAIN[0][0]);
    let n=0;for(const i of me.hand){const d=def(i);if(d.type==='A'||d.type==='D'){i.id=(d.type==='A'?'D':'A')+near(d.num);n++}}

/* あなたの手を確定（pi＝出す札、bi＝燃やす札。どちらも null なら見送る） */

function openEff(who,inst,msgs){

  const mn=who==='p'?'あなた':'相手',on=who==='p'?'相手':'あなた';

        if(op.traps.length){if(who==='p'){op.traps.forEach(t=>G.knownTrap.add(t.inst.uid));msgs.push(`偵察：相手の罠は「${op.traps.map(t=>def(t.inst).name).join('」「')}」`)}else msgs.push('偵察：あなたの罠を見られた')}

function cpuOppModel(){
  const P=G.p;

  const cnt=k=>1+recent.filter(x=>x===k).length*(G.cRead||.8);
  const hi=E,list=[];
  if(!P.noAtk&&hi>=5){
    list.push({d:{type:'A',num:numFor(hi),cost:hi,eff:null},w:cnt('A')*0.6});
    if(hi>=15)list.push({d:{type:'A',num:numFor(hi-10),cost:hi-10,eff:null},w:cnt('A')*0.4});
  }
  if(E>=5&&!P.noDef)list.push({d:{type:'D',num:numFor(Math.min(E,25)),cost:Math.min(E,25),eff:null},w:cnt('D')});
  list.push({d:null,w:cnt('P')*0.8});
  // 手札の内訳を見抜く相手：出せない種類は読みから外し、多い種類ほど重く見る
  if(G.cKnow||G.c.mixUntil>=G.turn){
    const n=t=>P.hand.filter(i=>def(i).type===t&&!blockReason(P,i)).length;
    for(const o of list)if(o.d){const k=n(o.d.type);o.w*=k?(0.6+k*.4):0}
  }
  const s=list.reduce((a,b)=>a+b.w,0)||1;list.forEach(o=>o.w/=s);
  return list;
}
/* 性格ごとのクセ。k は A・D・T（出す型）か B（燃やす） */

  if(st==='kyoki'){if(k==='A')return 0.6+0.05*d.num;if(k==='D')return -0.6;if(k==='B')return C.energy<=10?0.3:-0.6}

function oppDeckSeen(){const C=G.c,n=Math.max(G.p.kata==='me'?1:0,(G.p.shinganUntil>=G.turn)?3:0),out=[];

/* 手札公開ルール：CPU はあなたの手札を全部知っている。出しそうな種類（攻・防・罠・見送る）の重みは読みのまま使い、その種類の中で実際の札に配る */
function openModel(){
  const P=G.p,base=cpuOppModel(),wt={A:0,D:0,T:0,P:0};
  for(const m of base)wt[m.d?m.d.type:'P']+=m.w;
  const list=[{d:null,w:wt.P}];
  for(const t of ['A','D','T']){const cs=P.hand.filter(i=>def(i).type===t&&!blockReason(P,i));for(const i of cs)list.push({d:def(i),w:wt[t]/cs.length})}
  const sum=list.reduce((a,b)=>a+b.w,0)||1;list.forEach(o=>o.w/=sum);return list;
}
function seenModel(){
  if(isOpen())return openModel();
  const P=G.p,known=P.hand.filter(i=>G.knownByCpu.has(i.uid)||G.c.shinganUntil>=G.turn);
  if(!known.length)return cpuOppModel();
  const unk=(P.hand.length-known.length)/P.hand.length;
  const o=[...known.filter(i=>!blockReason(P,i)).map(i=>def(i)),null];
  const list=o.map(d=>({d,w:(1-unk)/o.length}));
  if(unk>0)for(const m of cpuOppModel())list.push({d:m.d,w:m.w*unk});

/* 相手の手：{play: 出す札, burn: 燃やす札}（どちらか一方。両方 null なら見送る）

function cpuChoose(peek){

  const model=peek===undefined?seenModel()

  const evOf=(d,bd=null)=>{let ev=0;for(const m of model){const r=outcome(P,C,m.d,d,null,bd);ev+=m.w*(-r.net/5)*(danger&&r.toP<r.toC?1.4:1)*(chance?1.2:1)}return ev};

    if(!burnBlock(C,o))combos.push({play:null,burn:o,ev:evOf(null,d)+0.09*gain-0.6-0.016*d.cost-(C.hand.length<=2?0.8:0)+styleBias('B',d)+(d.eff==='hiuchi'?0.8:d.eff==='okuribi'?0.5:d.eff==='noroshi'?0.5:0)});

    if(d.type==='T')ev+=1.6;if(d.eff==='meisou')ev+=0.9;if(d.eff==='yokoku')ev+=0.6;if(d.eff==='teisatsu'||d.eff==='kakuran')ev+=0.3;if(d.eff==='mikiri')ev+=P.traps.length?2:0.3;if(d.eff==='kamae')ev+=0.4;if(d.eff==='zanshin'||d.eff==='youdou')ev+=0.3;if(d.eff==='hikiashi')ev+=1.2;if(d.eff==='mizuzeme')ev+=0.3+(P.deck.length<8?0.8:0);if(d.eff==='yakiuchi'||d.eff==='kanashibari')ev+=0.3;if(d.eff==='katanagari')ev+=P.hand.some(x=>def(x).type==='A')?0.6:-0.4;if(d.eff==='yobimodoshi')ev+=C.discard.some(x=>def(x).type==='A')?0.6:-0.4;if(d.eff==='shizan')ev+=C.discard.length/12;if(d.eff==='onryou')ev+=C.discard.filter(x=>def(x).eff==='onryou').length*0.3;if(d.eff==='sekisho')ev+=P.energy>=20?0.5:0;

  let u=Math.random()*tot;for(let i=0;i<combos.length;i++){u-=ex[i];if(u<=0)return combos[i]}
  return combos[combos.length-1];
}

/* 画面の大きさに合わせて全体を拡大する（1〜1.6倍）。幅360px・縦700pxが等倍 */
function fitZoom(){
  const w=innerWidth,h=innerHeight;
  // 幅360px・縦700pxを基準に、それより大きい画面ではそのぶん拡大（スマホもパソコンも）
  const z=Math.max(1,Math.min(1.6,h/700,w/360));
  document.documentElement.style.setProperty('--z',z);
  document.body.classList.toggle('zoomed',z>1);
}
addEventListener('resize',fitZoom);fitZoom();
function render(){
  $app.className=(screen==='game'?'fit ':'')+`scene-${settings.scene||'sakura'} moon-${settings.moon||'full'}`;
  if(screen.startsWith('story-'))$app.innerHTML=storyScreenHTML();
  else if(screen==='prologue')$app.innerHTML=prologueHTML();
  else if(screen==='menu')$app.innerHTML=menuHTML();
  else if(screen==='school')$app.innerHTML=schoolHTML();
  else if(screen==='builder')$app.innerHTML=builderHTML();
  else if(screen==='rules')$app.innerHTML=rulesHTML();
  else if(screen==='game')$app.innerHTML=gameHTML();
  if(screen==='game'&&G.phase==='select')tick();
}

function rulesHTML(){
  return `<div class="row"><button class="btn ghost" data-act="go-menu">戻る</button></div>
  <div class="panel rules"><h2 style="font-size:20px">ルール（試作 v0.7）</h2><ol>
    <li>2人が同時に、手札から1枚を伏せるか、1枚を燃やして、一斉に開ける。見送ることはできない（出せる札も燃やせる札も無いときだけ、何もせずに終わる）。</li>
    <li><b>気力</b>：はじめは20。毎ターン自然には増えず、<b>札を燃やしたときだけ増える</b>（上限は無い）。カードは左上の気力を払って出す。気力の量は相手にも見えている。</li>
    <li><b>燃やす</b>：札を出す代わりに、手札を1枚燃やして伏せられる。そのターンは何もしていない扱いで、その札の気力（左上の数）と同じだけ気力が増え、次のターンから使える。何を燃やしたかは開けるときに相手に見える。</li>
    <li>2人は<b>橋</b>の上で向き合っている。<b>攻撃</b>は右上の数字の歩数だけ、相手を押し込む。</li>
    <li>攻撃と<b>防御</b>がぶつかったら：攻撃のほうが大きければ、<b>差だけ押す</b>（攻撃24対防御13なら11歩押し込む）。防御が攻撃以上なら防ぎきって、<b>攻撃をそのまま跳ね返す</b>（攻撃13対防御24なら、13跳ね返す）。防御の数字は「ここまでなら受け止められる」壁の高さ。</li>
    <li>読み合いの目安：攻撃は守っていない相手（燃やす・罠を張る）に強く、防御は攻撃に強い。燃やす・見送るは、相手が攻めてこないと読めたときに、気力や札を溜める手（攻撃されるとそのまま押し込まれる）。相手の防御を空振りさせれば、相手は気力を払い損。気力の量は見えているので、そこから相手の手を読む。</li>
    <li><b>手札は4枚</b>。毎ターンの終わりに、4枚になるまで山札から引く。</li>
    <li>攻撃どうしなら、数字の大きいほうが自分の数字ぶん押す。同じ数字なら相打ちで睨み合い。防御どうしも睨み合い。</li>
    <li><b>罠</b>は伏せて場に残る。張ったターンから効き、発動するまで場に残る。条件を満たしたら発動して捨てられる。罠は1枚まで（影の型は2枚）。いっぱいのときに新しい罠を張ると、一番古い罠が墓地に行って張り替わる。罠を張ったターンは、攻撃も防御もしていない扱い。</li>
    <li>相手を相手の岸（橋のたもと、40歩先）まで押し込んだら<b>勝負あり</b>。お互いの札（手札と山札）が尽きたら、押し込んでいる側の勝ち。山札が尽きて引けないターンは5歩押される。</li>
    <li>手札は5枚から始め、開けるたびに1枚引く（手札は7枚まで）。</li>
    <li>デッキは30枚。デッキには型がある。どの札も3枚まで入れられるが、デッキの型ではない効果の札は「型違い」になり、数字が5下がる（罠は気力が5多くかかる）。強いカードは気力で縛られるので、数字の上限は無い。</li>
    <li>試合の前に<b>型</b>と<b>奥義</b>を1つずつ選ぶ。型はいつも効く小さな特性で、相手にも見えている。奥義は3手目から、1試合に1回、伏せる前に使う大技で、相手には秘密（使ったことだけ知らされる）。相手の型や戦い方、状況から、どの奥義をいつ使ってくるかを読む。</li>
    <li>相手（CPU）には性格（強気・慎重・溜め屋）があり、相手の欄に出ている。クセを読んで裏をかく。</li>
    <li>選んだカードをもう一度タップすると伏せられる。持ち時間を過ぎると、選んでいたカードで確定する（無ければ、一番気力の増える札を燃やす）。</li>
  </ol>
  <h3 style="font-size:16px">型</h3>
  <dl class="dl">${Object.values(KATA).map(o=>`<dt>${o.name}</dt><dd>${o.text}</dd>`).join('')}</dl>
  <h3 style="font-size:16px">奥義</h3>
  <dl class="dl">${Object.values(OUGI).map(o=>`<dt>${o.name}</dt><dd>${o.text}</dd>`).join('')}</dl>
  </div>`;
}

function sideChips(s,isP){

    c.push(`<span class="chip ${s.ougiUsed?'':'warn'}">${s.genwakuUntil>=G.turn?`${og.name} 残${s.genwakuUntil-G.turn+1}`:'奥義'+(s.ougiUsed?'済':'？')}</span>`);

  }
  for(const t of s.traps){
    const w=t.active?'':' wait',tt=t.active?'発動待ち':'次のターンから効く';
    c.push(isP?`<button class="chip trap${w}" data-act="mytrap" data-uid="${t.inst.uid}" title="${tt}" aria-label="罠：${def(t.inst).name}（${tt}）">罠:${def(t.inst).name}</button>`:`<span class="chip trap${w}" title="${tt}" aria-label="罠（${tt}）">${trapSeen(t)?'罠:'+label(def(t.inst)):'罠あり'}</span>`);
  }

  return `<div class="chips">${c.join('')}</div>`;
}
const energyHTML=s=>{
  const gain=G.phase==='result'?(s===G.p?G.pGain:G.cGain):0;
  return `<span class="energy" aria-label="気力${s.energy}">気力<b>${s.energy}</b>${gain?`<span class="gain">燃やして${sgn(gain)}</span>`:''}</span>`;
};
/* 燃やしたときは、結果の説明を「燃やした」が分かる言い方にする */
function whyText(){
  const pd=G.pPlay?def(G.pPlay):null,cd=G.cPlay?def(G.cPlay):null,pb=!!G.pBurned,cb=!!G.cBurned;
  const pk=pd?pd.type:'',ck=cd?cd.type:'';
  if(pb&&cb)return '両方とも燃やした';
  if(cb&&pk==='A')return '相手は燃やしたので守りなし：そのまま押す';
  if(pb&&ck==='A')return 'あなたは燃やしたので守りなし：そのまま押される';
  if(cb&&pk==='D')return 'あなたの防御は空振り（相手は燃やして気力を溜めた）';
  if(pb&&ck==='D')return '相手の防御は空振り（あなたは燃やして気力を溜めた）';
  if(pb||cb)return `${pb?'あなた':'相手'}は燃やして気力を溜めた`;
  return G.res.why;
}

function overHTML(){
  if(G.tut!=null)return `<div class="modal-bg"><div class="modal result-modal" role="dialog" aria-modal="true" aria-labelledby="ovt">
    <div class="result-head"><h2 id="ovt" class="win">チュートリアル完了</h2><p class="muted small">攻撃・防御・燃やす・罠・奥義をひととおり使った。</p></div>
    <ul class="tut-sum">
      <li><b>攻撃</b>は、守っていない相手（燃やす・罠を張る）に強い</li>
      <li><b>防御</b>は、攻撃してくる相手に強い。防ぎきれば攻撃をそのまま跳ね返す</li>
      <li><b>燃やす</b>は、何もしない代わりに気力を溜める手。気力は次のターンから使える。攻撃されるとそのまま押し込まれる</li>
      <li>相手の<b>気力</b>や、これまでの動きから、次の手を読もう</li>
      <li>本番では、型と奥義を自分で選ぶ。相手（CPU）にも性格と奥義がある</li>
    </ul>
    <div class="row"><button class="btn" data-act="go-school">対戦する</button><button class="btn ghost" data-act="go-menu">メニュー</button></div>
  </div></div>`;
  const w=G.over.winner,st=G.st||{yomiP:0,yomiC:0,bestCombo:0,maxPush:0,maxPushed:0};
  const ri=rankIdx(rec.w),cur=RANKS[ri],next=RANKS[ri+1];
  const pct=next?Math.round((rec.w-cur[0])/(next[0]-cur[0])*100):100;
  return `<div class="modal-bg"><div class="modal result-modal" role="dialog" aria-modal="true" aria-labelledby="ovt">
    <div class="result-head">
      <h2 id="ovt" class="${w==='p'?'win':w==='c'?'lose':''}">${w==='p'?'勝ち':w==='c'?'負け':'引き分け'}</h2>
      <p class="muted small">${G.over.reason}・${G.turn}手</p>
    </div>
    ${G.char&&w?`<p class="quote"><b>${G.char.name}</b>「${w==='p'?G.char.lose:G.char.win}」</p>`:''}
    <div class="tiles">
      <div class="tile${st.yomiP>st.yomiC?' hi':''}"><b>${st.yomiP}<small style="font-size:14px"> 回</small></b><span>読み勝ち（読まれた ${st.yomiC}回）</span></div>
      <div class="tile${st.bestCombo>=3?' hi':''}"><b>${st.bestCombo}<small style="font-size:14px"> 連</small></b><span>いちばん長く続けて読み勝った</span></div>
      <div class="tile"><b>${st.maxPush}<small style="font-size:14px"> 歩</small></b><span>1手でいちばん押し込んだ</span></div>
      <div class="tile"><b>${G.p.ougiUsed?OUGI[G.p.ougi].name:'—'}</b><span>${G.p.ougiUsed?'使った奥義':'奥義は使わなかった'}</span></div>
    </div>
    ${G.newSkin?`<div class="rankup"><b>侍の姿「${G.newSkin}」を手に入れた</b><span>メニューの「段位と戦績」で、舞台の自分の侍に使える</span></div>`:''}
    ${G.rankUp?`<div class="rankup"><b>${G.rankUp.name}に昇段！</b>${G.rankUp.unlock.length?`<span>${G.rankUp.unlock.join('・')}を解放した</span>`:''}</div>`:''}
    <div class="rankbar">
      <div class="lbl"><b>${cur[1]}</b><span>${next?`${next[1]}まで あと${next[0]-rec.w}勝`:'最高位'}</span></div>
      <div class="bar" role="img" aria-label="次の段位まで${pct}%"><i style="width:${pct}%"></i></div>
      <div class="lbl"><span>${rec.w}勝 ${rec.l}敗${rec.streak>=2?`・${rec.streak}連勝中`:''}</span></div>
    </div>
    <details class="opp-info"><summary>${G.char?G.char.name:'相手'}の手の内を見る</summary>
      <dl class="dl">
        <dt>相手</dt><dd>${KATA[G.c.kata].name}の型・奥義「${OUGI[G.c.ougi].name}」（${G.c.ougiUsed?'使った':'使わなかった'}）<br><span class="muted small">${OUGI[G.c.ougi].text}</span></dd>
        <dt>デッキ</dt><dd>${G.cpuDeck}</dd>
        <dt>性格</dt><dd>${STYLES[G.style].name}（${STYLES[G.style].desc}）</dd>
        <dt>あなた</dt><dd>${KATA[G.p.kata].name}の型・奥義「${OUGI[G.p.ougi].name}」</dd>
      </dl></details>
    ${G.story?`<div class="row">${w==='p'?(story&&story.active?`<button class="btn" data-act="story-reward">褒美を選ぶ（${KAN[story.round-1]}人抜き）</button>`:`<button class="btn" data-act="story-endscreen">結末へ</button>`):`<button class="btn" data-act="story-endscreen">今宵の終わり</button>`}</div>`
      :`<div class="row"><button class="btn" data-act="go-school">もう一戦</button><button class="btn ghost" data-act="go-menu">メニュー</button></div>`}
  </div></div>`;
}
function modalHTML(){
  let body;
  if(G.modal==='log'){
    body=`<h3>記録</h3>${G.log.length?`<ol class="loglist" reversed>${[...G.log].reverse().map(l=>`<li>${l}</li>`).join('')}</ol>`:'<p class="muted small">まだありません</p>'}`;
  }else{
    const s=G.modal==='p'?G.p:G.c;
    const who=G.modal==='p'?'あなた':'相手';
    // 山札は順番を隠して、残っている札の名前と枚数だけ
    const cnt={};for(const x of s.deck){const n=label(def(x));cnt[n]=(cnt[n]||0)+1}
    const deckList=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).map(([n,c])=>`<span class="chip">${n}${c>1?`×${c}`:''}</span>`).join('');
    body=`<h3>${who}の山札と墓地</h3>
    <div class="pile"><div class="pile-h"><b>山札</b><span>残り${s.deck.length}枚（これから引く札。順番は分からない）</span></div>
      ${s.deck.length?`<div class="chips">${deckList}</div>`:'<p class="muted small">もう無い（引けないターンは5歩押される）</p>'}</div>
    <div class="pile"><div class="pile-h"><b>墓地（捨て札）</b><span>${s.discard.length}枚（出した札・燃やした札）</span></div>
      ${s.discard.length?`<div class="mini-list">${[...s.discard].reverse().map(x=>cardHTML(x,{act:'noop'})).join('')}</div>`:'<p class="muted small">まだありません</p>'}</div>`;
  }
  return `<div class="modal-bg" data-act="close-modal"><div class="modal" role="dialog" aria-modal="true">
    <div class="modal-top"><button class="btn ghost" data-act="close-modal">閉じる</button></div>${body}</div></div>`;
}

/* ---------- 操作 ---------- */
document.addEventListener('change',e=>{
  if(e.target.id==='timerSel'){settings.timer=Number(e.target.value);store.set(KEY_SET,settings)}
  if(e.target.id==='volSel'){settings.vol=Number(e.target.value);store.set(KEY_SET,settings);setVolume()}
  if(e.target.id==='speedSel'&&SPEEDS[e.target.value]){settings.speed=e.target.value;store.set(KEY_SET,settings)}
});
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  // 結果が出ているあいだは、ボタンや札以外のどこをタップしても次へ
  if(!el){if(screen==='game'&&G&&G.phase==='result'&&!G.over&&!G.modal&&!e.target.closest('button,select,a,.modal')){if(G.tut!=null)G.tut++;startTurn()}return}
  const act=el.dataset.act;
  if(act==='close-modal'&&el.classList.contains('modal-bg')&&e.target!==el)return;
  switch(act){
    case 'look':{const kind=el.dataset.kind,list=kind==='scene'?SCENES:MOONS,x=list.find(o=>o.key===el.dataset.key);if(x&&unlocked(x)){settings[kind]=x.key;store.set(KEY_SET,settings);render()}break}
    case 'open-hand':settings.openHand=!settings.openHand;applyOpenTexts(settings.openHand);store.set(KEY_SET,settings);render();break;
    case 'snd-sfx':settings.sound=!settings.sound;if(!settings.sound)settings.bgm=false;store.set(KEY_SET,settings);if(!settings.sound)bgmStop();render();break;
    case 'snd-bgm':if(settings.sound&&settings.bgm){settings.bgm=false}else{settings.sound=true;settings.bgm=true}store.set(KEY_SET,settings);render();break;
    case 'snd-test':{
      const was=settings.sound;settings.sound=true;const ac=audio();settings.sound=was;
      if(!ac){sndState='この画面では音を出せない（ブラウザが音を止めている）。Chrome などのブラウザで開くと鳴ることがある';render();break}
      SFX.clang(ac,ac.currentTime+.05,1);
      const g=ac.createGain();g.gain.value=.7;g.connect(outOf(ac));for(let i=0;i<16;i++)bgmStep(ac,g,ac.currentTime+.6+i*STEP,i);
      setTimeout(()=>{sndState=ac.state==='running'?'音は出せる状態（鳴らなければ、端末のメディア音量を上げる）':`音が止められている（状態：${ac.state}）。Chrome などのブラウザで開くと鳴ることがある`;const el=document.getElementById('sndState');if(el)el.textContent=sndState},400);
      break}
    case 'prologue-end':settings.seenPrologue=true;store.set(KEY_SET,settings);screen='menu';render();window.scrollTo(0,0);break;
    case 'prologue':screen='prologue';render();break;
    case 'tutorial':bgmStart();startTutorial();window.scrollTo(0,0);break;
    case 'resume':bgmStart();resumeGame();window.scrollTo(0,0);break;
    case 'go-menu':bgmStop();clearTimers();screen='menu';G=null;render();window.scrollTo(0,0);break;
    case 'go-school':pickFor='duel';bgmStop();clearTimers();screen='school';G=null;render();window.scrollTo(0,0);break;
    case 'go-builder':screen='builder';builderPreset=null;render();window.scrollTo(0,0);break;
    case 'go-rules':screen='rules';render();break;
    case 'pick-kata':case 'pick-ougi':{const kind=act.slice(5);if(kind==='kata'&&el.dataset.k!==settings.deckKata)break;pick[kind]=el.dataset.k;settings[kind]=el.dataset.k;store.set(KEY_SET,settings);render();break}
    case 'story-new':pickFor='story';screen='school';G=null;render();window.scrollTo(0,0);break;
    case 'story-start':if(pick.kata&&pick.ougi){pickFor='duel';storyBegin(pick.kata,pick.ougi);window.scrollTo(0,0)}break;
    case 'story-next':screen='story-round';render();break;
    case 'story-continue':{const sv=readSave();if(sv&&sv.story){bgmStart();resumeGame()}else{screen=story.rewards?'story-reward':'story-round';render()}window.scrollTo(0,0);break}
    case 'story-ougi':if(OUGI[el.dataset.k]){story.ougi=el.dataset.k;saveStory();render()}break;
    case 'story-fight':storyFight();window.scrollTo(0,0);break;
    case 'story-reward':bgmStop();clearTimers();screen='story-reward';render();window.scrollTo(0,0);break;
    case 'story-pick':{const id=el.dataset.id;if(id&&CARDS[id])story.extra[id]=(story.extra[id]||0)+1;story.rewards=null;saveStory();screen='story-round';render();window.scrollTo(0,0);break}
    case 'story-endscreen':bgmStop();clearTimers();screen='story-end';render();window.scrollTo(0,0);break;
    case 'story-quit':story.active=false;story.result='lose';saveStory();screen='story-end';render();break;
    case 'story-again':pickFor='story';screen='school';G=null;render();window.scrollTo(0,0);break;
    case 'start-game':if(pick.kata&&pick.ougi){clearSave();bgmStart();startGame(pick.kata,pick.ougi);window.scrollTo(0,0)}break;
    case 'inc':{const id=el.dataset.id;if(deckStats(deck).n<DECK_SIZE&&(deck[id]||0)<copyMax(id)){deck[id]=(deck[id]||0)+1;saveDeck();render()}break}
    case 'dec':{const id=el.dataset.id;if(deck[id]){deck[id]--;if(!deck[id])delete deck[id];saveDeck();render()}break}
    case 'bkata':builderKata=el.dataset.k;render();break;
    case 'btab':if(TY[el.dataset.t]){builderTab=el.dataset.t;render();const g=document.querySelector('.group');if(g&&g.getBoundingClientRect().top<0)g.scrollIntoView({block:'start'})}break;
    case 'deck-kata':if(KATA[el.dataset.k]){settings.deckKata=el.dataset.k;pick.kata=el.dataset.k;settings.kata=el.dataset.k;store.set(KEY_SET,settings);render()}break;
    case 'preset':{const p=PRESETS.find(x=>x.key===el.dataset.key);deck={...p.cards};settings.deckKata=p.kata;pick.kata=p.kata;settings.kata=p.kata;store.set(KEY_SET,settings);builderPreset=p;saveDeck();render();break}
    case 'clear':deck={};builderPreset=null;saveDeck();render();break;
    case 'hand':{
      const x=G.p.hand.find(i=>String(i.uid)===el.dataset.uid);if(!x)return;
      G.detail=x;G.schoolInfo=false;
      if(G.phase==='select'){
        if(G.burnMode&&tutStep()&&!(tutStep().burn||[]).includes(x.id)){render();return}
        if(G.burnMode&&burnBlock(G.p,x)){render();return}
        if(G.burnMode){G.burnMode=false;G.pBurn=x;G.sel=null;render();return}
        if(G.pBurn===x){commit(null,x);return}
        if(blockReason(G.p,x)){render();return}
        if(G.sel===x){commit(x);return}
        G.sel=x;G.pBurn=null;
      }
      render();break;
    }
    case 'detail':{const x=G&&G.c.hand.find(i=>String(i.uid)===el.dataset.uid);if(x){G.detail=x;render()}break}
    case 'mulligan':if(G&&G.turn===1&&G.phase==='select'&&!G.pMull&&G.tut==null){const P=G.p;P.deck.push(...P.hand);P.hand=[];shuffle(P.deck);drawN(P,HAND_START);G.pMull=true;G.sel=null;G.pBurn=null;log('手札を引き直した');saveGame();render()}break;
    case 'mytrap':{const t=G.p.traps.find(t=>String(t.inst.uid)===el.dataset.uid);if(t){G.detail=t.inst;render()}break}
    case 'school-info':G.schoolInfo=!G.schoolInfo;G.oppInfo=false;render();break;
    case 'unzoom':if(G){G.detail=null;render()}break;
    case 'skin':{const x=SKINS.find(o=>o.key===el.dataset.key);if(x&&skinOpen(x)){settings.skin=x.key;store.set(KEY_SET,settings);render()}break}
    case 'opp-info':G.oppInfo=!G.oppInfo;G.schoolInfo=false;render();break;
    case 'commit':if(G.pBurn)commit(null,G.pBurn);else if(G.sel)commit(G.sel);break;
    case 'pass':if(G&&!G.p.hand.some(i=>!blockReason(G.p,i)||!burnBlock(G.p,i)))commit(null);break;
    case 'burn':if(G&&G.phase==='select'){if(G.pBurn){G.pBurn=null;G.burnMode=false}else G.burnMode=!G.burnMode;render()}break;
    case 'ougi':useOugi();break;
    case 'next':if(G&&G.phase==='result'&&!G.over){if(G.tut!=null)G.tut++;startTurn()}break;
    case 'resign':if(G&&!G.over){clearTimers();G.over={winner:'c',reason:'投了した'};G.phase='result';clearSave();recordResult();storyAfterMatch();render()}break;
    case 'discard':G.modal=el.dataset.who;render();break;
    case 'open-log':G.modal='log';render();break;
    case 'sound':{
      // 音なし → 効果音 → 効果音＋曲 → 音なし
      if(!settings.sound){settings.sound=true;settings.bgm=false}else if(!settings.bgm){settings.bgm=true}else{settings.sound=false;settings.bgm=false}
      store.set(KEY_SET,settings);
      if(settings.sound){const ac=audio();if(ac&&!settings.bgm)SFX.clang(ac,ac.currentTime+.02,.8)}
      if(settings.bgm)bgmStart();else bgmStop();
      render();break}
    case 'close-modal':G.modal=null;render();break;
  }
});
if(!settings.seenPrologue)screen='prologue';
render();
</script>
</body>
</html>
